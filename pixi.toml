[workspace]
name = "pdm-group-35"
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
# ROS 2 Humble + Gazebo Classic (same as the RSP environment)
ros-humble-ros-base = "*"
ros-humble-ros2cli = "*"
ros-humble-rclpy = "*"
ros-humble-geometry-msgs = "*"
ros-humble-nav-msgs = "*"
ros-humble-gazebo-ros-pkgs = "*"
adwaita-icon-theme = "<40"   # GUI icon fix copied from the RSP environment
# MPC
numpy = "*"
matplotlib = "*"
cvxpy = "*"

[pypi-dependencies]
gurobipy = "*"

[activation.env]
GAZEBO_SUPPRESS_EOL_WARNING = "1"
ROS_LOCALHOST_ONLY = "1"
